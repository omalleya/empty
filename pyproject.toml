[project]
name = "kroger-cart"
version = "0.1.0"
description = "Import a free-text shopping list into a Kroger-family account's cart via the official Kroger public API."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "anthropic>=0.40",
    "requests>=2.31",
    "pydantic>=2.6",
]

[project.scripts]
kroger-cart = "kroger.shopping_list:main"

[project.optional-dependencies]
dev = [
    "python-dotenv>=1.0",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["kroger"]

[tool.ruff]
line-length = 100
target-version = "py310"
